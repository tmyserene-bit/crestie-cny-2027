function useOn(id){
 const q=quests[state.scene],a=missionActions[q.id];
 if(!state.selected){toast('Choose a useful item from your inventory first.');return false}
 if(state.selected!==a.item||id!==a.target){toast('That item does not work here. Look for another clue.');return true}
 state.activated[q.id]=true;state.selected=null;state.points+=15;
 log('✨ '+a.text);save();render();
 openModal('✨ Something changed!',`<div class="guide">${mascot()}<p>${a.text}</p></div><p>The mystery mechanism is now active. You can attempt the final puzzle for this location.</p>`,'Solve this location',()=>{modal=null;puzzle()});
 return true;
}
function inspect(id){if(state.selected){useOn(id);return}let q=quests[state.scene];if(!q)return;let s=state.seen[q.id]||[];if(!s.includes(id)){s.push(id);state.seen[q.id]=s;state.points+=5;log(q.name+': found '+q.objects.find(o=>o[0]===id)[2]);let items={chinatown:{id:'slip',emoji:'🧩',name:'Character 快'},reunion:{id:'fish',emoji:'🐟',name:'Yu sheng fish'},lion:{id:'beat',emoji:'🥁',name:'Beat pattern'},visit:{id:'oranges',emoji:'🍊',name:'Oranges'},zodiac:{id:'goat',emoji:'🐐',name:'Goat clue'},lantern:{id:'calendar',emoji:'🗓️',name:'Day 15 clue'}};let keys={chinatown:'lantern',reunion:'basket',lion:'poster',visit:'basket',zodiac:'tablet',lantern:'moon'};if(keys[q.id]===id&&!state.items.some(x=>x.id===items[q.id].id)){state.items.push(items[q.id]);log('Collected '+items[q.id].name)}}save();render();openModal(q.objects.find(o=>o[0]===id)[2],`<p>${hints[q.id][id]}</p>${s.length===4?'<p class="badge">Now select your collected item and use it on something in the scene!</p>':''}`,'Continue',()=>{modal=null;render()})}function selectItem(id){state.selected=state.selected===id?null:id;save();render();toast(state.selected?'Selected '+state.items.find(x=>x.id===id).name:'Item unselected')}function openModal(title,body,label='Continue',action=()=>{modal=null;render()}){modal={title,body,label,action};showModal()}function showModal(){document.querySelector('.overlay')?.remove();if(!modal)return;let d=document.createElement('div');d.className='overlay';d.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(modal.title)}"><h2>${modal.title}</h2><div id="modalBody">${modal.body}</div><div class="actions"><button class="primary" id="modalMain">${modal.label}</button><button class="secondary" id="modalClose">Close</button></div></div>`;document.body.appendChild(d);d.querySelector('#modalMain').onclick=modal.action;d.querySelector('#modalClose').onclick=()=>{modal=null;d.remove()}}function updateModal(body){modal.body=body;showModal()}function puzzle(){let q=quests[state.scene];if(!q||state.done.includes(q.id))return;sequence=[];feedback='';if(q.id==='chinatown')return sequencePuzzle('📜 Repair the couplet','The torn sign reads 新年 _ 乐. Tap the missing character, then restore the greeting.','新年快乐',['乐','快','福','羊'],'chinatown');if(q.id==='reunion')return multiPuzzle('🥢 Prepare the yu sheng','Choose ALL three items that belong in the yu sheng platter. You found a recipe and a basket of ingredients.',['🐟 Fish','🥕 Shredded vegetables','🥣 Sauce','🍰 Birthday cake','🍔 Burger'],[0,1,2],'reunion');if(q.id==='lion')return sequencePuzzle('🥁 Restore the lion dance beat','Use the rehearsal sheet. Tap the instruments in the correct four-beat order.','🥁🥁🔔🥁',['🥁','🔔','🥁','🥁'],'lion');if(q.id==='visit')return multiPuzzle('🍊 Plan a respectful New Year visit','Choose ALL actions that show understanding of the traditions and the host.',['Offer a New Year greeting','Respect different family customs','Exchange mandarin oranges if the host follows this custom','Insist every household follows identical rules','Assume everyone celebrates the same way'],[0,1,2],'visit');if(q.id==='zodiac')return sequencePuzzle('🐐 Rebuild the zodiac sequence','Put the five animals in their traditional order, using the wheel and stone tablet.','🐍🐎🐐🐒🐓',['🐒','🐍','🐓','🐐','🐎'],'zodiac');if(q.id==='lantern')return timelinePuzzle()}
function sequencePuzzle(title,description,answer,options,id){let picked=[];function draw(){openModal(title,`<p>${description}</p><div class="sequence">${picked.map((v,i)=>`<button class="chip" onclick="window.seqUndo(${i})">${v} ✕</button>`).join('')||'<span class="muted">Tap the tiles below…</span>'}</div><div class="choicegrid">${options.map((v,i)=>`<button class="choice ${used.includes(i)?'used':''}" ${used.includes(i)?'disabled':''} onclick="window.seqPick(${i})">${v}</button>`).join('')}</div><p class="muted">Tap a chosen tile to remove it. Check when finished.</p>${feedback?`<div class="feedback">${feedback}</div>`:''}`,'Check sequence',()=>{if(picked.join('')===answer){complete(id)}else{feedback='Not quite. Revisit the clues and try again. No points lost.';draw()}})}let used=[];window.seqPick=i=>{used.push(i);picked.push(options[i]);feedback='';draw()};window.seqUndo=i=>{used.splice(i,1);picked.splice(i,1);feedback='';draw()};draw()}
function multiPuzzle(title,description,options,correct,id){let selected=[];function draw(){openModal(title,`<p>${description}</p><div class="choicegrid">${options.map((v,i)=>`<button class="choice ${selected.includes(i)?'selected':''}" onclick="window.multiPick(${i})">${selected.includes(i)?'✓ ':''}${v}</button>`).join('')}</div><p class="muted">Choose all that apply, then check.</p>${feedback?`<div class="feedback">${feedback}</div>`:''}`,'Check choices',()=>{if(selected.length===correct.length&&correct.every(i=>selected.includes(i)))complete(id);else{feedback='Some choices need another look. Use the evidence you collected.';draw()}})}window.multiPick=i=>{selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];feedback='';draw()};draw()}
function timelinePuzzle(){let options=['7 days','12 days','15 days','30 days'],chosen=-1;function draw(){openModal('🏮 Light the final lantern',`<p>The moon chart and the festival guide mention a celebration ending at 元宵节 (Yuánxiāo Jié). How many days does the traditional Chinese New Year festival span?</p><div class="choicegrid">${options.map((v,i)=>`<button class="choice ${chosen===i?'selected':''}" onclick="window.timelinePick(${i})">${v}</button>`).join('')}</div><p class="muted">This is the final piece of the six-seal mystery.</p>${feedback?`<div class="feedback">${feedback}</div>`:''}`,'Light lantern',()=>{if(chosen===2)complete('lantern');else{feedback='Not yet. The last day is the Lantern Festival. Check the moon chart.';draw()}})}window.timelinePick=i=>{chosen=i;feedback='';draw()};draw()}
function complete(id){if(state.done.includes(id))return;state.done.push(id);state.points+=35;let q=quests.find(x=>x.id===id);state.items.push({id:'seal-'+id,emoji:'🔖',name:q.seal});log('Restored '+q.blessing+' seal: '+q.seal);save();openModal('✨ '+q.blessing+' restored!',`<div class="guide">${mascot()}<p>“We did it! We recovered the word <strong>${q.seal}</strong>. But what does the whole message say?”</p></div><p>+35 points · One more seal added to your inventory.</p><p>Look out for a surprise bonus round!</p>`,'Continue',()=>{modal=null;state.scene=-1;save();render();if(!state.bonus.includes(id))bonusRound(id);else if(state.done.length===6)finale()})}
const bonusQuestions={chinatown:['What does 新年快乐 (xīn nián kuài lè) mean?',['Happy New Year','Good morning','Thank you'],0,'新年快乐 means Happy New Year.'],reunion:['In Singapore, what is lo hei (捞起)?',['Tossing yu sheng while sharing good wishes','A lion dance drumbeat','Giving a wedding gift'],0,'Lo hei is a popular Singaporean Chinese New Year tradition.'],lion:['Which instrument is commonly part of a lion dance performance?',['Gong','Piano','Violin'],0,'Drums, cymbals and gongs commonly accompany lion dances.'],visit:['Some families avoid sweeping on the first day because…',['It symbolises sweeping away good fortune','Brooms disappear','It is against the law'],0,'This is a traditional belief, not a rule followed by every family.'],zodiac:['Which animal comes directly before Goat in the zodiac?',['Horse','Rabbit','Rooster'],0,'The order is Snake, Horse, Goat, Monkey, Rooster.'],lantern:['What is 元宵节 (Yuánxiāo Jié)?',['Lantern Festival','Dragon Boat Festival','Mid-Autumn Festival'],0,'The Lantern Festival marks the fifteenth day of the lunar new year.']};function bonusRound(id){
 const type=({chinatown:'catch',reunion:'lohei',lion:'rhythm',visit:'catch',zodiac:'lantern',lantern:'lohei'})[id]||'catch';
 let active=true,finished=false,timer=null,raf=0,cleanupFns=[];
 const add=(el,event,fn)=>{el.addEventListener(event,fn);cleanupFns.push(()=>el.removeEventListener(event,fn))};
 const stop=()=>{active=false;clearInterval(timer);cancelAnimationFrame(raf);cleanupFns.forEach(f=>f());cleanupFns=[]};
 const finish=(score,max,detail)=>{if(finished)return;finished=true;stop();const earned=Math.round(25*Math.max(0,Math.min(1,score/max)));state.points+=earned;state.bonus.push(id);save();openModal('🎉 Bonus complete!',`<div class="guide">${mascot()}<p>“We did it together!”</p></div><p><strong>${score} / ${max} · +${earned} bonus points</strong></p><p>${detail}</p>`,'Continue',()=>{modal=null;render();if(state.done.length===6)finale()})};
 const show=(title,html,setup)=>{openModal(title,html,'Skip bonus',()=>finish(0,1,'You can continue the adventure!'));setup();const close=document.getElementById('modalClose');if(close)close.onclick=()=>finish(0,1,'You can continue the adventure!')};
 if(type==='catch'){
  const good=id==='visit'?'🍊':'🧧';let score=0,miss=0,left=25,objs=[],x=70,last=0,spawn=0;
  show(good==='🍊'?'🍊 Mandarin Orange Dash':'🧧 Red Packet Catch',`<p>Move Crestie to catch ${good}. Avoid the 💨 gusts! You have 25 seconds.</p><div class="catch-hud"><span>Collected: <b id="catchScore">0</b></span><span>Time: <b id="catchTime">25s</b></span></div><div id="catchGame" class="catch-area"><div class="catch-player">${mascot()}</div></div><p class="muted">Drag on the play area, or use ◀ ▶ / keyboard arrows.</p><div class="catch-controls"><button class="secondary" id="catchLeft">◀</button><button class="secondary" id="catchRight">▶</button></div>`,()=>{
   const arena=document.getElementById('catchGame'),player=arena.querySelector('.catch-player');
   const move=(v)=>{x=Math.max(0,Math.min(arena.clientWidth-90,v));player.style.transform=`translateX(${x}px)`};move((arena.clientWidth-90)/2);
   const pointer=e=>{e.preventDefault();move(e.clientX-arena.getBoundingClientRect().left-45)};
   add(arena,'pointerdown',pointer);add(arena,'pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});
   add(document.getElementById('catchLeft'),'click',()=>move(x-45));add(document.getElementById('catchRight'),'click',()=>move(x+45));
   add(document,'keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(x+(e.key==='ArrowLeft'?-40:40))}});
   timer=setInterval(()=>{left--;const t=document.getElementById('catchTime');if(t)t.textContent=left+'s';if(left<=0)finish(score,14,`Caught ${score} festive items. ${good==='🍊'?'Mandarin oranges can symbolise good fortune during New Year visits.':'Red packets (红包, hóngbāo) convey blessings and good wishes.'}`)},1000);
   const frame=now=>{if(!active)return;let dt=last?Math.min(.05,(now-last)/1000):0;last=now;spawn+=dt;if(spawn>.56){spawn=0;let bad=Math.random()<.23,el=document.createElement('div');el.className='catch-object';el.textContent=bad?'💨':good;arena.appendChild(el);objs.push({el,x:Math.random()*(arena.clientWidth-45),y:-50,v:125+Math.random()*90,bad})}
    for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.y+=o.v*dt;o.el.style.transform=`translate(${o.x}px,${o.y}px)`;if(o.y>arena.clientHeight-95&&o.y<arena.clientHeight-46&&o.x+28>x+8&&o.x<x+78){if(o.bad){score=Math.max(0,score-2);miss++}else score++;o.el.remove();objs.splice(i,1)}else if(o.y>arena.clientHeight){o.el.remove();objs.splice(i,1)}}document.getElementById('catchScore').textContent=score;raf=requestAnimationFrame(frame)};raf=requestAnimationFrame(frame)
  });return;
 }
 if(type==='rhythm'){
  const pattern=['🥁','🥁','🔔','🥁','🔔','🥁'];let step=0,mistakes=0,left=30;
  show('🥁 Lion Dance Rhythm Challenge',`<p>Help the lion dance troupe! Memorise the rehearsal beat and tap the instruments in order.</p><div class="rhythm-lion" id="rhythmLion">🦁</div><div class="rhythm-pattern">${pattern.map((v,i)=>`<span id="beat${i}">${v}</span>`).join('')}</div><p>Beat: <b id="rhythmProgress">0 / ${pattern.length}</b> · Time: <b id="rhythmTime">30s</b></p><div class="catch-controls"><button class="primary rhythm-hit" data-beat="🥁">🥁 Drum</button><button class="primary rhythm-hit" data-beat="🔔">🔔 Gong</button></div><p class="muted">Listen to the sequence with your eyes first, then perform it together!</p>`,()=>{
   document.querySelectorAll('.rhythm-hit').forEach(btn=>add(btn,'click',()=>{if(!active)return;let hit=btn.dataset.beat;if(hit===pattern[step]){document.getElementById('beat'+step).classList.add('beat-done');step++;document.getElementById('rhythmProgress').textContent=step+' / '+pattern.length;const lion=document.getElementById('rhythmLion');lion.classList.remove('lion-bounce');void lion.offsetWidth;lion.classList.add('lion-bounce');if(step===pattern.length)finish(Math.max(1,6-mistakes),6,'Drums, cymbals and gongs are used in lion dance performances.')}else{mistakes++;document.getElementById('rhythmProgress').textContent=step+' / '+pattern.length+' · Try again!'}}));
   timer=setInterval(()=>{left--;document.getElementById('rhythmTime').textContent=left+'s';if(left<=0)finish(step,6,'The lion dance is traditionally accompanied by lively percussion.')},1000)
  });return;
 }
 if(type==='lohei'){
  const ingredients=[['🐟','Fish','abundance'],['🥕','Vegetables','good fortune'],['🍊','Citrus','good luck'],['🥢','Chopsticks','tossing together']];let placed=[],left=30;
  show('🥢 Lo Hei Toss Challenge',`<p>Prepare Singapore-style yu sheng! Tap each ingredient to add it to the platter, then toss together.</p><div class="lohei-bowl" id="loheiBowl">🥗<div id="loheiInside"></div></div><p>Ingredients added: <b id="loheiCount">0 / 4</b> · Time: <b id="loheiTime">30s</b></p><div class="lohei-grid">${ingredients.map((it,i)=>`<button class="secondary lohei-item" data-i="${i}">${it[0]} ${it[1]}</button>`).join('')}</div><button class="primary" id="loheiToss" disabled>🥢 Toss together!</button>`,()=>{
   document.querySelectorAll('.lohei-item').forEach(btn=>add(btn,'click',()=>{let i=Number(btn.dataset.i);if(placed.includes(i))return;placed.push(i);btn.disabled=true;document.getElementById('loheiInside').textContent=placed.map(j=>ingredients[j][0]).join(' ');document.getElementById('loheiCount').textContent=placed.length+' / 4';if(placed.length===4)document.getElementById('loheiToss').disabled=false}));
   add(document.getElementById('loheiToss'),'click',()=>{document.getElementById('loheiBowl').classList.add('bowl-toss');setTimeout(()=>finish(placed.length,4,'Lo hei (捞起) is a Singaporean Chinese New Year tradition of tossing yu sheng while sharing good wishes.'),700)});
   timer=setInterval(()=>{left--;document.getElementById('loheiTime').textContent=left+'s';if(left<=0)finish(placed.length,4,'Yu sheng is commonly shared during Singapore Chinese New Year celebrations.')},1000)
  });return;
 }
 if(type==='lantern'){
  let seq=[],entry=[],round=0,left=30,locked=false;
  show('🏮 Lantern Light-Up Challenge',`<p>Watch the lanterns light up, then repeat their order. Complete three rounds!</p><div class="lantern-grid">${['🏮','🏮','🏮','🏮'].map((x,i)=>`<button class="lantern-tile" data-i="${i}">${x}<small>${i+1}</small></button>`).join('')}</div><p id="lanternStatus">Watch the pattern…</p><p>Time: <b id="lanternTime">30s</b></p><button class="secondary" id="lanternReplay">Replay pattern</button>`,()=>{
   const tiles=[...document.querySelectorAll('.lantern-tile')];const flash=i=>{tiles[i].classList.add('lit');setTimeout(()=>tiles[i]?.classList.remove('lit'),390)};
   const playback=()=>{locked=true;entry=[];document.getElementById('lanternStatus').textContent='Watch the pattern…';seq.forEach((n,i)=>setTimeout(()=>{if(active)flash(n)},i*650+300));setTimeout(()=>{if(active){locked=false;document.getElementById('lanternStatus').textContent='Your turn! Tap the lanterns in order.'}},seq.length*650+350)};
   const next=()=>{round++;seq.push(Math.floor(Math.random()*4));document.getElementById('lanternStatus').textContent='Round '+round+' / 3';playback()};
   tiles.forEach((tile,i)=>add(tile,'click',()=>{if(locked||!active)return;flash(i);entry.push(i);if(i!==seq[entry.length-1]){document.getElementById('lanternStatus').textContent='Try again — watch carefully!';playback();return}if(entry.length===seq.length){locked=true;if(round===3)finish(3,3,'The Lantern Festival (元宵节) marks the fifteenth day of the traditional Lunar New Year celebration.');else setTimeout(()=>{if(active)next()},600)}}));
   add(document.getElementById('lanternReplay'),'click',playback);next();timer=setInterval(()=>{left--;document.getElementById('lanternTime').textContent=left+'s';if(left<=0)finish(round-1,3,'The Lantern Festival is celebrated on day 15 of the lunar new year.')},1000)
  });return;
 }
}
function finale(){if(state.done.length<6)return;openModal('🔐 The final message',`<p>You have recovered all six seals:</p><div class="sequence">${quests.map(q=>`<span class="chip">${q.seal}</span>`).join('')}</div><p>Read the words in order. What message did the mysterious figure leave?</p><div class="choicegrid"><button class="choice" onclick="window.finalAnswer(0)">TOGETHER WE MAKE OUR NEW YEAR</button><button class="choice" onclick="window.finalAnswer(1)">THE GOAT HID ALL THE LANTERNS</button></div><p class="muted">Discuss with your team before choosing.</p>`,'Return to map',()=>{modal=null;render()});window.finalAnswer=i=>{if(i===0){state.finished=true;state.points+=50;log('Mystery solved: Together we make our new year.');save();modal=null;render();openModal('🎉 Mystery solved!',`<div class="guide">${mascot()}<p>“We discovered that a celebration becomes meaningful when people share, learn and respect one another!”</p></div><p><strong>TOGETHER WE MAKE OUR NEW YEAR.</strong></p><p>The mysterious caretaker wanted everyone to look beyond the decorations and discover the traditions and people behind the celebration.</p><p><strong>I can, you can, we can!</strong> Your team earned ${state.points} points.</p>`,'Celebrate!',()=>{modal=null;render()})}else toast('The six seals tell a different story. Read them in order.')}}function finalScreen(){return `<div class="guide">${mascot()}<p><strong>TOGETHER WE MAKE OUR NEW YEAR.</strong><br>Well done, ${escapeHtml(state.team)}!</p></div><h3>⭐ ${state.points} points · 6 blessings restored</h3><p>You explored Chinese New Year customs, solved the zodiac cipher, restored the lion dance, prepared yu sheng and learned how different families celebrate.</p><p><strong>Reflection:</strong> What is one tradition you understand better now? How did your team work together?</p><div class="actions"><button class="secondary" onclick="showMap()">Revisit map</button><button class="secondary" onclick="restart()">Start a new team</button></div>`}function restart(){if(confirm('Erase this team’s progress and start again?')){localStorage.removeItem(storage);location.reload()}}function showInstructions(){openModal('❔ How to play','<p>1. Work together in a group of 3–5 and share one phone.</p><p>2. Explore characters and objects for clues. You do not have to tap everything.</p><p>3. Select a collected item in your inventory, then tap a matching object in the scene to activate its mechanism. Solve the puzzle and collect six seals.</p><p>4. Open bonus red packets for extra points.</p><p>5. Solve the final message after all six missions.</p><p>Progress saves on this device. No login or internet connection is required after the page loads.</p>')}render();if(state.team&&!state.finished&&state.done.length===6&&state.scene<0)setTimeout(finale,250);
</script></body></html>
