<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8c1f37"><title>Crestie and the Lost Blessings · CNY 2027</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#fff8e9;background:#211b39}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#653153,#211b39 70%);min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffd66e;outline-offset:3px}.shell{max-width:960px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.04em}.pill{border:1px solid #f5b85e66;border-radius:50px;padding:7px 12px;background:#ffffff14;font-size:.86rem}.panel{background:#352b4d;border:1px solid #c59a6b65;border-radius:22px;box-shadow:0 14px 40px #08051a55;overflow:hidden;margin-top:14px}.inner{padding:20px}.hero{position:relative;min-height:330px;background:linear-gradient(160deg,#a63749,#5b2854 60%,#2c254c);display:grid;place-items:center;text-align:center;padding:25px;overflow:hidden}.hero:before{content:'🏮　✦　🏮　✦　🏮';position:absolute;top:20px;left:0;width:100%;font-size:30px;opacity:.7}.hero h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.05;margin:0;text-shadow:0 4px 12px #3b1738}.hero p{max-width:530px;margin:16px auto}.crestie{font-size:85px;filter:drop-shadow(0 8px 4px #25172a88);animation:bob 2.5s ease-in-out infinite}.crestie:after{content:'🧭';font-size:30px;position:absolute;transform:translate(-16px,55px)}@keyframes bob{50%{transform:translateY(-9px) rotate(-3deg)}}.primary{background:#ffd36b;color:#47233d;border:0;border-radius:14px;padding:13px 20px;font-weight:900;box-shadow:0 5px 0 #b87934}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #b87934}.secondary{background:#ffffff17;color:#fff8e9;border:1px solid #e7c29c88;border-radius:12px;padding:10px 14px}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.small{font-size:.84rem;opacity:.84}.muted{color:#d8cbdf}.progress{height:10px;background:#17142b;border-radius:10px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#f7a655,#ffe59a);transition:width .4s}.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.zone{border:1px solid #e8c19a77;border-radius:17px;padding:15px;background:linear-gradient(155deg,#7b3a57,#453251);color:#fff;text-align:left;min-height:155px;transition:transform .2s}.zone:hover{transform:translateY(-3px)}.zone .emoji{font-size:42px;display:block}.zone strong{display:block;margin:8px 0 4px}.zone.done{border-color:#ffe08c;background:linear-gradient(145deg,#6d6240,#3e4b44)}.zone:disabled{opacity:.55;cursor:not-allowed}.scene{position:relative;min-height:310px;border-radius:16px;overflow:hidden;background:linear-gradient(#ba5865 0 48%,#77516b 48% 68%,#4d4157 68%);display:flex;align-items:center;justify-content:center;gap:clamp(5px,2vw,20px);padding:20px;flex-wrap:wrap}.scene:before{content:'✦　🏮　✦　🏮　✦';position:absolute;top:10px;font-size:24px;opacity:.65;letter-spacing:10px}.object{z-index:1;min-width:90px;max-width:160px;min-height:125px;padding:12px 8px;border:2px solid #ffe6a0aa;border-radius:16px;background:#382943bb;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 #22182b}.object .emoji{font-size:49px}.object.seen{border-color:#8de1b1}.object span:last-child{font-weight:700;font-size:.9rem}.dialogue{background:#201a35;border-left:4px solid #ffca6e;padding:15px;border-radius:12px;margin:15px 0;min-height:65px}.challenge{background:#241e39;border:1px solid #9b8193;border-radius:16px;padding:16px;margin-top:15px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:13px 0}.choice{padding:13px;text-align:left;border-radius:12px;background:#50415f;border:1px solid #b89bb2;color:#fff}.choice.selected{border:2px solid #ffdb7c;background:#70556a}.status{padding:11px;border-radius:10px;background:#ffffff10;margin-top:10px}.good{color:#aef4c6}.warn{color:#ffe09a}input{background:#fff9eb;border:0;padding:13px;border-radius:10px;width:100%;max-width:360px;color:#2b2340}.footer{text-align:center;font-size:.8rem;color:#c8bbd1;padding:25px 0}.overlay{position:fixed;inset:0;background:#0b0a19dd;display:grid;place-items:center;z-index:20;padding:16px}.modal{background:linear-gradient(145deg,#7b3456,#34284e);border:2px solid #f4cc7c;border-radius:24px;padding:26px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 90px #0009}.modal .big{font-size:64px}.hidden{display:none!important}.badgebar{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#ffffff12;border:1px solid #ffe2a166;border-radius:25px;padding:8px 12px}.subtitle{font-size:1.12rem;line-height:1.5}.instructions{background:#ffffff10;border-radius:12px;padding:12px;margin:12px 0}.puzzleitem{font-size:28px}.pulse{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px #ffdd7133}}@media(max-width:520px){.shell{padding:10px}.inner{padding:15px}.scene{min-height:360px}.object{min-width:88px;max-width:110px;min-height:112px}.object .emoji{font-size:39px}}
</style></head><body><main class="shell"><div class="top"><div class="brand">🏮 CRESTIE'S NEW YEAR QUEST <span class="small">2027</span></div><div class="controls"><span class="pill" id="groupTag">Group: —</span><span class="pill" id="scoreTag">⭐ 0</span><button class="secondary" id="resetBtn" title="Start again">↻ Reset</button></div></div><div id="app"></div><div class="footer">Crest Secondary · Cultural discovery through teamwork · No student accounts or personal data required</div></main><div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div><script>
const zones=[
{title:'Lantern Lane',emoji:'🏮',value:'Renewal',intro:'The lanterns have dimmed. Explore the street to learn how New Year preparations mark a fresh beginning.',objects:[['🏮','Lantern','Red lanterns are often displayed for festive joy and good fortune. Decorations vary between families.'],['🧹','Broom','Some families clean their homes before the New Year as a symbol of clearing away the old.'],['🧧','Red packet','Red packets are commonly given as gestures of blessing and good wishes. Practices differ by family.']],question:'The celebration begins tomorrow. Which plan best reflects the clues you found?',choices:['Clean and prepare the home before the New Year, then decorate to welcome a fresh start.','Wait until the celebration starts, then focus only on giving red packets.','Put up decorations but ignore the meaning of preparing for a new beginning.'],correct:0,why:'Preparing and decorating can symbolise welcoming a fresh beginning. Different households follow different customs.'},
{title:'Reunion Kitchen',emoji:'🍲',value:'Family',intro:'The reunion table is missing its meaning! Investigate the dishes before deciding how to complete the meal.',objects:[['🐟','Fish','In Mandarin, fish (yú) sounds like the word for surplus (yú). Fish can symbolise abundance.'],['🍜','Long noodles','Long noodles can symbolise wishes for longevity.'],['🍊','Mandarin oranges','Mandarin oranges are exchanged during visits in many Singaporean Chinese households as symbols of good fortune.']],question:'A family wants to express BOTH wishes for abundance and long life. Which pair fits best?',choices:['Mandarin oranges and red lanterns','Fish and long noodles','Long noodles and a broom'],correct:1,why:'Fish is linked to surplus and long noodles to longevity. Not all families serve the same dishes.'},
{title:'Lion Dance Square',emoji:'🦁',value:'Joy',intro:'The lion dance team needs help preparing its performance. Discover the instruments, then restore the rhythm.',objects:[['🥁','Drum','The drum sets a strong rhythmic foundation for a lion dance.'],['🥢','Cymbals','Cymbals add sharp metallic accents to the performance.'],['🦁','Lion costume','Two performers commonly coordinate the head and body of a southern lion costume.']],question:'The drummer starts a pattern: BOOM · BOOM · CLASH. Which sequence repeats it correctly?',choices:['BOOM · CLASH · BOOM','CLASH · BOOM · BOOM','BOOM · BOOM · CLASH'],correct:2,why:'The repeating rhythm is BOOM · BOOM · CLASH. Drum and cymbals work together to support the dance.'},
{title:'Visiting House',emoji:'🏠',value:'Respect',intro:'A friend invites your group to join a New Year visit. Explore the objects and conversation before responding.',objects:[['🍊','Oranges','In many Singaporean Chinese households, visitors bring a pair of mandarin oranges and exchange good wishes.'],['💬','Greeting','A common greeting is 新年快乐 (xīn nián kuài lè), meaning Happy New Year.'],['👪','Family note','Not every Chinese family celebrates in the same way. When unsure, asking politely shows respect.']],question:'Your friend’s family has a custom you have never seen. What is the most thoughtful response?',choices:['Assume every Chinese family follows exactly the same custom.','Ask politely what the custom means and follow the family’s guidance.','Avoid taking part because the tradition is unfamiliar.'],correct:1,why:'Respect means being curious without making assumptions. You can appreciate a tradition without needing to share the same background.'},
{title:'Harmony Courtyard',emoji:'🤝',value:'Harmony',intro:'The final blessing is hidden in a community celebration. Listen to different voices and find what connects them.',objects:[['🧑‍🤝‍🧑','Friends','People of different races and religions can learn about each other’s celebrations while respecting boundaries.'],['🎊','Festival','Chinese New Year is celebrated in many ways across Singapore, including visits, meals and community events.'],['💌','Invitation','A thoughtful invitation gives friends room to ask questions or decline particular activities respectfully.']],question:'Your group is planning a celebration for classmates of different backgrounds. Which plan is most inclusive?',choices:['Invite everyone, explain the activities, and allow classmates to participate comfortably in different ways.','Require everyone to follow the same family customs to show unity.','Avoid discussing cultural traditions so no one asks questions.'],correct:0,why:'Inclusion combines learning, invitation and respect for individual choices. Cultural appreciation does not require identical participation.'}
];
const key='crestie-cny27-v1';let state=load();let screen=state.group?'map':'start';let selected=-1;let modalOpen=false;
function fresh(){return {group:'',completed:[],seen:{},score:0,bonus:[],dialogue:'',attempts:{}}}function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(key))}}catch{return fresh()}}function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateHeader(){document.getElementById('groupTag').textContent='Group: '+(state.group||'—');document.getElementById('scoreTag').textContent='⭐ '+state.score}function setScreen(s){screen=s;selected=-1;render();window.scrollTo({top:0,behavior:'smooth'})}function overlay(html){modalOpen=true;document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}function closeModal(){modalOpen=false;document.getElementById('overlay').classList.add('hidden')}function btn(t,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function render(){updateHeader();let app=document.getElementById('app');if(screen==='start'){app.innerHTML=`<section class="panel"><div class="hero"><div><div class="crestie">🐯</div><h1>Crestie and the<br>Lost Blessings</h1><p class="subtitle">Five blessings have vanished from the New Year town. Explore, investigate, and bring the celebration back!</p></div></div><div class="inner"><h2>🎒 Assemble your adventure team</h2><p>Play together on one device. Read clues aloud, discuss your ideas and take turns tapping the screen.</p><label for="groupInput">Your team name (no personal names needed)</label><div class="controls" style="margin-top:10px"><input id="groupInput" maxlength="24" placeholder="e.g. The Lantern Detectives" autocomplete="off">${btn('Begin adventure →','begin()')}</div><div class="instructions">⏱ About 25–30 minutes with group discussion · 📱 Works on phones and laptops · 🌏 Everyone is welcome to explore</div></div></section>`;return}if(screen==='map'){app.innerHTML=`<section class="panel"><div class="inner"><h1>🗺️ The New Year Town</h1><p class="muted">Crestie: “Each location holds a clue. Explore every object before solving its mystery!”</p><div class="progress"><span style="width:${state.completed.length*20}%"></span></div><p class="small">Blessings restored: ${state.completed.length}/5</p><div class="badgebar">${zones.map((z,i)=>`<span class="badge">${state.completed.includes(i)?'✨':'🔒'} ${z.value}</span>`).join('')}</div><h2>Choose your next destination</h2><div class="map">${zones.map((z,i)=>`<button class="zone ${state.completed.includes(i)?'done':''}" onclick="openZone(${i})"><span class="emoji">${z.emoji}</span><strong>${i+1}. ${z.title}</strong><span class="small">${state.completed.includes(i)?'✓ Blessing restored':'Explore and investigate'}</span></button>`).join('')}</div>${state.completed.length===5?`<p style="margin-top:20px">${btn('✨ Enter the final celebration','setScreen(\'final\')')}</p>`:''}</div></section>`;return}if(screen.startsWith('zone:')){let i=+screen.split(':')[1],z=zones[i],seen=state.seen[i]||[],done=state.completed.includes(i);app.innerHTML=`<section class="panel"><div class="inner"><div class="controls">${btn('← Town map','setScreen(\'map\')','secondary')}<span class="pill">Quest ${i+1}/5 · ${z.value}</span></div><h1>${z.emoji} ${z.title}</h1><p class="subtitle">${z.intro}</p><div class="scene">${z.objects.map((o,j)=>`<button class="object ${seen.includes(j)?'seen':''}" onclick="inspect(${i},${j})"><span class="emoji">${o[0]}</span><span>${o[1]} ${seen.includes(j)?'✓':''}</span></button>`).join('')}</div><div class="dialogue" id="dialogue">🧭 Crestie: “Tap the objects to investigate. Share what you discover with your team.”</div><p class="small">🔎 Evidence found: ${seen.length}/3</p>${seen.length===3?`<div class="challenge"><h2>🧩 Mystery challenge</h2><p>${z.question}</p><div class="choices">${z.choices.map((c,j)=>`<button class="choice ${selected===j?'selected':''}" onclick="choose(${i},${j})">${String.fromCharCode(65+j)}. ${c}</button>`).join('')}</div><div id="feedback"></div>${done?'<p class="good">✓ Blessing already restored</p>':''}</div>`:`<div class="instructions">🔒 Challenge unlocks after your group investigates all three clues.</div>`}</div></section>`;return}if(screen==='final'){app.innerHTML=`<section class="panel"><div class="hero"><div><div class="crestie">🐯</div><h1>🎉 Blessings Restored!</h1><p class="subtitle">The lanterns glow again! Your team helped Crestie bring the New Year celebration to life.</p></div></div><div class="inner" style="text-align:center"><h2>🏆 ${esc(state.group)}</h2><p>All five blessings collected!</p><div class="badgebar" style="justify-content:center">${zones.map(z=>`<span class="badge">✨ ${z.value}</span>`).join('')}</div><h2>⭐ ${state.score} points</h2><p>Team reflection: Which tradition surprised you? How can we show respect when learning about another community's celebration?</p><div class="controls" style="justify-content:center">${btn('Explore the town again','setScreen(\'map\')','secondary')}${btn('Start a new group','resetGame()')}</div></div></section>`}}
function begin(){let name=document.getElementById('groupInput').value.trim();if(!name){alert('Please enter a team name.');return}state.group=name.slice(0,24);save();overlay(`<div class="big">📜</div><h2>A message from the town</h2><p>“Our five blessings are missing! Only teams who explore, listen and work together can restore them.”</p><p class="small">Take turns reading clues aloud. Every team member should contribute.</p>${btn('Accept the quest!','closeModal();setScreen(\'map\')')}`)}function openZone(i){setScreen('zone:'+i)}function inspect(i,j){let seen=state.seen[i]||[];if(!seen.includes(j)){seen.push(j);state.seen[i]=seen;save()}let o=zones[i].objects[j];render();document.getElementById('dialogue').innerHTML=`<strong>${o[0]} ${o[1]}</strong><p>${o[2]}</p>`;if(seen.length===3&&seen.indexOf(j)===2&&!state.completed.includes(i))setTimeout(()=>{if(screen==='zone:'+i&&!modalOpen)overlay(`<div class="big">🔓</div><h2>Mystery unlocked!</h2><p>Your team has collected all three clues. Discuss the evidence before choosing your answer.</p>${btn('Solve the mystery','closeModal()')}`)},250)}function choose(i,j){let z=zones[i];selected=j;let feedback=document.getElementById('feedback');if(j!==z.correct){state.attempts[i]=(state.attempts[i]||0)+1;save();feedback.innerHTML=`<div class="status warn">🔎 Not quite. Review the clues and discuss another possibility. You can try again.</div>`;document.querySelectorAll('.choice').forEach((b,k)=>b.classList.toggle('selected',k===j));return}let first=!state.completed.includes(i);if(first){state.completed.push(i);state.score+=100;save()}feedback.innerHTML=`<div class="status good">✓ ${z.why}</div>`;render();overlay(`<div class="big">✨</div><h2>${z.value} restored!</h2><p>${z.why}</p><p class="good">${first?'+100 points earned!':'You have already completed this quest.'}</p>${btn('Continue adventure','closeModal();bonusOrMap('+i+')')}`)}function bonusOrMap(i){if(!state.bonus.includes(i)){state.bonus.push(i);save();const prompts=['Name one way your family or community welcomes a new beginning.','Share one way a meal can bring people together.','Make a three-beat rhythm together using gentle taps.','Practise saying “Happy New Year” in a language you know.','Each teammate names one way to make classmates feel included.'];overlay(`<div class="big">🧧</div><h2>Bonus red packet!</h2><p>${prompts[i]}</p><p class="small">Complete this as a team. No single correct answer.</p>${btn('We did it! +20 points','awardBonus('+i+')')}`)}else setScreen('map')}function awardBonus(i){state.score+=20;save();closeModal();setScreen('map');if(state.completed.length===5)overlay(`<div class="big">🎆</div><h2>All blessings restored!</h2><p>You've completed the adventure. Time for the final celebration!</p>${btn('Celebrate!','closeModal();setScreen(\'final\')')}`)}function resetGame(){if(confirm('Reset this device’s adventure progress and team name?')){state=fresh();save();closeModal();setScreen('start')}}document.getElementById('resetBtn').addEventListener('click',resetGame);render();
</script></body></html>
